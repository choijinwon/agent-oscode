<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>OSCODE · UI 상태 검증 예제</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}body{margin:0;background:#111c1b;color:#e4eee9;font:16px/1.65 system-ui}main{max-width:760px;margin:8vh auto;padding:28px}header{color:#8de6c2;letter-spacing:.08em}h1{font-size:clamp(28px,6vw,42px);line-height:1.3}p{color:#b8c9c4}.panel{padding:28px;border:1px solid #37564a;border-radius:18px;background:#1b2b26;margin-top:30px}button{font:inherit;background:#8de6c2;color:#11251b;border:0;border-radius:8px;padding:12px 24px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}#loading{color:#8de6c2}#error{color:#ffb5ad}small{display:block;color:#9db5aa;margin-top:24px}li{padding:12px}code{overflow-wrap:anywhere}
</style><main><header>OSCODE / STATE LAB</header><h1>문제가 생겨도<br>화면은 준비되어 있나요?</h1><p>느린 응답, 오류, 빈 결과, 정상 복구를 지정한 시나리오로 확인하는 테스트용 화면입니다.</p><section class="panel"><button id="load">결과 불러오기</button><p id="loading" role="status" hidden>결과를 불러오는 중입니다.</p><p id="error" role="alert" hidden>요청에 실패했습니다. 다시 시도해 주세요.</p><p id="empty" hidden>검색 결과가 없습니다.</p><ul id="items"></ul></section><small>실제 서비스가 아닌 OSCODE 기능 검증용 예제입니다.<br>일반 실행에서는 정상 응답합니다. 상태 재현은 시나리오 실행 때만 적용됩니다.</small></main><script>
const load=document.querySelector('#load'),loading=document.querySelector('#loading'),error=document.querySelector('#error'),empty=document.querySelector('#empty'),items=document.querySelector('#items');
load.onclick=async()=>{load.disabled=true;loading.hidden=false;error.hidden=true;empty.hidden=true;items.replaceChildren();try{const response=await fetch('/api/items');if(!response.ok)throw Error('request failed');const data=await response.json();empty.hidden=data.length!==0;for(const item of data){const li=document.createElement('li');li.textContent=item.name;items.append(li);}}catch{error.hidden=false;}finally{loading.hidden=true;load.disabled=false;}};
</script></html>
